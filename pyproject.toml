[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speakhire-recommender"
version = "1.0.0"
description = "AI-powered resume analysis, job matching, and college recommendation pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.2",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "fastmcp>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
llm = [
    "openai>=1.0",
]

[tool.setuptools.packages.find]
include = ["recommender*"]