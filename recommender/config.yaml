# SpeakHire Recommender — Central Configuration
# All previously hardcoded values live here now.
# Edit this file instead of touching Python source.

# ── Pipeline Tuning ───────────────────────────────────────────────
pipeline:
  confidence_boost: 35
  fit_boost: 25
  fit_ready_boost: 5
  fit_aspire_penalty: 5
  route_low_conf: 30
  route_top_gap: 12
  route_intent_min: 0.45
  evidence_skill_max: 50
  evidence_junk_ratio: 0.08
  evidence_market_overlap: 0.30
  sparse_skill_threshold: 30
  narrow_pools: ["legal", "engineering", "science", "agriculture", "personal-care"]
  valid_fallbacks: ["support", "administrative", "education", "social-service"]
  noise_functions: ["arts-media", "hospitality", "sales", "ops", "support", "finance"]
  caregiving_functions: ["education", "healthcare", "social-service", "other", "hospitality"]
  xf_boost: 15

