# ── Eligibility Screening ─────────────────────────────────────────
eligibility:
  batch_size: 40
  age_range: [16, 20]

# ── Student Lifecycle (NEW — Phase 1b) ────────────────────────────
student_lifecycle:
  stages:
    high_school:
      label: "High School Student"
      recommended: internships
      aspirational: entry_level
    college_freshman:
      label: "College Freshman"
      recommended: internships
      aspirational: entry_level
    college_senior:
      label: "College Senior"
      recommended: [internships, entry_level]
      aspirational: mid_level
  level_filter:
    intern: [intern, Intern, internship, Internship]
    entry: [entry, Entry, junior, Junior]
    mid: [mid, Mid, associate, Associate]
    senior: [senior, Senior, staff, Staff]
  study_level_mapping:
    high-school: high_school
    certificate: college_freshman
    associate: college_senior
    bachelor: college_senior
    master: college_senior
    doctoral: college_senior

# ── College Recommendation (NEW — Phase 1c) ───────────────────────
college:
  scorecard_api:
    base_url: "https://api.data.gov/ed/collegescorecard/v1/schools"
    per_page: 100
    fields:
      - id
      - school.name
      - school.city
      - school.state
      - school.school_url
      - latest.admissions.admission_rate.overall
      - latest.cost.attendance.academic_year
      - latest.cost.tuition.in_state
      - latest.cost.tuition.out_of_state
      - latest.earnings.10_yrs_after_entry.median
      - latest.completion.completion_rate_4yr_150nt
      - latest.student.size
      - latest.programs.cip_4_digit
      - school.degrees_awarded.predominant
      - school.carnegie_size_setting
  tiers:
    reach:
      admission_pct_max: 0.25
    match:
      admission_pct_min: 0.25
      admission_pct_max: 0.60
    safety:
      admission_pct_min: 0.60
  cip_to_function:
    "11": technology
    "14": engineering
    "26": science
    "27": science
    "51": healthcare
    "13": education
    "44": social-service
    "50": arts-media
    "52": finance
    "09": arts-media
    "45": social-service
    "42": social-service
    "03": agriculture
    "04": design
    "54": history
    "16": linguistics
    "23": arts-media
  ranker:
    weights:
      program_fit: 0.35
      cost_fit: 0.20
      admission_fit: 0.20
      outcome_fit: 0.25
    max_cost: 60000
    min_earnings: 25000
    max_earnings: 90000